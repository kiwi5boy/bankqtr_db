[project]
name = "bankqtr-db"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "html5lib>=1.1",
    "httpx>=0.28.1",
    "lxml>=6.1.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pdfplumber>=0.11.10",
    "polars>=1.43.2",
    "pyarrow>=25.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bankqtr_db", "callrpt_db"]

[dependency-groups]
app = [
    "altair>=6.2.2",
    "marimo>=0.24.0",
]
dev = [
    "pytest>=9.1.1",
]
# Only examples/ needs these; the build and test paths do not.
examples = [
    "ipykernel>=6.30.1",
    "matplotlib>=3.10.6",
    "nbclient>=0.10.2",
]
